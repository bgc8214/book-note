name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 검수 후 머지 없이 수동으로 다시 배포하고 싶을 때
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것을 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # npm run build = validate -> index -> astro build.
      # 스키마를 어긴 콘텐츠는 여기서 배포 전에 걸린다.
      - uses: withastro/action@v5
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
